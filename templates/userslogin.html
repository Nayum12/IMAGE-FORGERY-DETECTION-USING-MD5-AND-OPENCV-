{% extends "index.html" %}
{% block title %}
<style>
    .login-wrapper {
        background: linear-gradient(135deg, #74ebd5, #acb6e5);
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 15px;
    }
    .form-container {
        max-width: 420px;
        width: 100%;
        padding: 35px 40px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }
    .form-container h2 {
        text-align: center;
        margin-bottom: 28px;
        color: #333;
        font-weight: 700;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #555;
    }
    .form-group input[type="email"],
    .form-group input[type="password"] {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
        transition: border-color 0.3s;
    }
    .form-group input[type="email"]:focus,
    .form-group input[type="password"]:focus {
        border-color: #28b3a7;
        outline: none;
    }
    .form-group input[type="submit"] {
        background-color: #28b3a7;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 12px 20px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        width: 100%;
        font-size: 16px;
        font-weight: 600;
    }
    .form-group input[type="submit"]:hover {
        background-color: #1d9089;
    }
    .form-footer {
        margin-top: 15px;
        text-align: center;
        color: #555;
    }
    .form-footer a {
        color: #28b3a7;
        text-decoration: none;
        font-weight: 600;
    }
    .form-footer a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-wrapper">
    <div class="form-container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger text-center mb-3">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <h2>User Login</h2>
        <form action="{% url 'userslogin' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group">
                <input type="submit" value="Login">
            </div>
        </form>
        <p class="form-footer">Don't have an account? <a href="{% url 'userregister' %}">Register here</a></p>
    </div>
</div>
{% endblock title %}

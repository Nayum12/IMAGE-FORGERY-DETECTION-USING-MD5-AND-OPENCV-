{% extends "home.html" %}
{% block title %}
<style>
    .upload-wrapper {
        background: linear-gradient(135deg, #74ebd5, #acb6e5);
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 15px;
    }
    .form-container {
        max-width: 460px;
        width: 100%;
        padding: 35px 40px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }
    .form-container h2 {
        text-align: center;
        margin-bottom: 28px;
        color: #333;
        font-weight: 700;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 15px;
        font-weight: 600;
        color: #444;
    }
    .form-group input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        background: #fafafa;
        cursor: pointer;
    }
    .form-group input[type="submit"] {
        background-color: #28b3a7;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 12px 20px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        width: 100%;
        font-size: 16px;
        font-weight: 600;
    }
    .form-group input[type="submit"]:hover {
        background-color: #1d9089;
    }
</style>

<div class="upload-wrapper">
    <div class="form-container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success text-center mb-3">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <h2>Upload Images</h2>
        <form action="{% url 'uploadfile' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="upload1">Original Image (Image 1)</label>
                <input type="file" id="upload1" name="upload1" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="upload2">Comparison Image (Image 2)</label>
                <input type="file" id="upload2" name="upload2" accept="image/*" required>
            </div>
            <div class="form-group">
                <input type="submit" value="Detect Forgery">
            </div>
        </form>
    </div>
</div>
{% endblock title %}

{% extends "index.html" %}
{% block title %}
<style>
    .register-wrapper {
        background: linear-gradient(135deg, #74ebd5, #acb6e5);
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 15px;
    }
    .form-container {
        background-color: #fff;
        padding: 35px 40px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        width: 100%;
        max-width: 620px;
    }
    .form-container h2 {
        text-align: center;
        margin-bottom: 24px;
        color: #333;
        font-weight: 700;
    }
    .form-row {
        display: flex;
        gap: 15px;
        margin-bottom: 16px;
    }
    .form-row > div {
        flex: 1;
    }
    .form-field {
        margin-bottom: 16px;
    }
    .form-field label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #555;
        font-size: 14px;
    }
    .form-field input[type="text"],
    .form-field input[type="email"],
    .form-field input[type="password"],
    .form-field input[type="date"],
    .form-field input[type="tel"],
    .form-field select,
    .form-field textarea {
        width: 100%;
        padding: 9px 13px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
        transition: border-color 0.3s;
    }
    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
        border-color: #28b3a7;
        outline: none;
    }
    textarea { resize: vertical; }
    .submit-btn {
        width: 100%;
        padding: 12px;
        background-color: #28b3a7;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: background-color 0.3s;
        margin-top: 8px;
    }
    .submit-btn:hover { background-color: #1d9089; }
    .form-footer {
        margin-top: 15px;
        text-align: center;
        color: #555;
    }
    .form-footer a {
        color: #28b3a7;
        text-decoration: none;
        font-weight: 600;
    }
    .form-footer a:hover { text-decoration: underline; }
</style>

<div class="register-wrapper">
    <div class="form-container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger text-center mb-3">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <h2>User Registration</h2>
        <form action="{% url 'userregister' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-row">
                <div>
                    <div class="form-field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Full name" required>
                    </div>
                </div>
                <div>
                    <div class="form-field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Email address" required>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <div class="form-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>
                </div>
                <div>
                    <div class="form-field">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <div class="form-field">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                </div>
                <div>
                    <div class="form-field">
                        <label for="contact">Contact Number</label>
                        <input type="tel" id="contact" name="contact" placeholder="Contact number" required>
                    </div>
                </div>
            </div>
            <div class="form-field">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="2" placeholder="Your address" required></textarea>
            </div>
            <div class="form-field">
                <label for="profile">Profile Picture</label>
                <input type="file" id="profile" name="profile" accept="image/*" required>
            </div>
            <button type="submit" class="submit-btn">Register</button>
        </form>
        <p class="form-footer">Already have an account? <a href="{% url 'userslogin' %}">Login here</a></p>
    </div>
</div>
{% endblock title %}
